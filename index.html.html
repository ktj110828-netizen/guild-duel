te'+i).textContent=`기준 ${r[1]}${r[4]?'분':''}당 ${fmt(rate(r))}점`;$('score'+i).textContent='+'+fmt(p)+'점'});$('total').textContent=fmt(total)+'점';$('final').textContent='사용 후 최종 점수: '+fmt(total+num(state.cur[day]))+'점';save()}function research(){$('research').innerHTML=names.map((n,i)=>`<div class="research"><span class="research-name"><img src="${icons[i]}" alt="" width="52" height="44">${n}</span><select aria-label="${n}" data-r="${i}">${Array.from({length:i?11:21},(_,j)=>`<option value="${j}" ${state.lv[i]===j?'selected':''}>Lv.${j} (+${j*5}%)</option>`).join('')}</select></div>`).join('');$('research').querySelectorAll('select').forEach(s=>s.onchange=()=>{state.lv[+s.dataset.r]=+s.value;calc()})}function render(){state.day=day;$('nav').innerHTML=days.map((d,i)=>`<button class="${i===day?'active':''}" data-day="${i}">${d}</button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{day=+b.dataset.day;render()});$('heading').textContent=days[day]+' · '+themes[day];$('current').value=state.cur[day];$('items').innerHTML=data[day].map((r,i)=>`<article><strong>${r[0]}</strong><small id="rate${i}"></small><div class="line"><input aria-label="${r[0]} 수량" type="number" min="0" step="any" inputmode="decimal" placeholder="0" data-q="${i}"><select aria-label="${r[0]} 단위" data-u="${i}">${(r[4]?['분','시간','일']:['기본','K','M','G']).map(u=>`<option>${u}</option>`).join('')}</select></div><div class="score" id="score${i}"></div></article>`).join('');$('items').querySelectorAll('input').forEach(e=>{let i=+e.dataset.q;e.value=state.q[day][i][0];e.oninput=()=>{state.q[day][i][0]=e.value;calc()}});$('items').querySelectorAll('select').forEach(e=>{let i=+e.dataset.u;e.value=state.q[day][i][1];e.onchange=()=>{state.q[day][i][1]=e.value;calc()}});calc()}$('current').oninput=e=>{state.cur[day]=e.target.value;calc()};$('resetDay').onclick=()=>{if(confirm(days[day]+' 입력 수량을 초기화할까요?')){state.q[day]=fresh().q[day];state.cur[day]='';render()}};$('resetResearch').onclick=()=>{if(confirm('모든 연구 레벨을 0으로 초기화할까요?')){state.lv=Array(8).fill(0);research();calc()}};research();render();</script></body></html>
